# ============================================================
#  Student Management System - Application Configuration
# ============================================================

# Server port (default: 8080)
server.port=8080

# Application name
spring.application.name=student-management-system

# ============================================================
#  MySQL Database Configuration
#  NOTE: Update username and password to match your MySQL setup
# ============================================================

# Database URL (change 'sms_db' if you use a different database name)
spring.datasource.url=jdbc:mysql://localhost:3306/sms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# MySQL credentials
spring.datasource.username=root
spring.datasource.password=root

# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
#  JPA / Hibernate Configuration
# ============================================================

# Automatically create/update tables based on entity classes
# Options: none | validate | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (set to false in production)
spring.jpa.show-sql=true

# Format the SQL output for readability
spring.jpa.properties.hibernate.format_sql=true

# Database dialect for MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
#  Logging
# ============================================================
logging.level.com.sms=DEBUG
logging.level.org.springframework.web=INFO
